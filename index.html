<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#1e293b">
<title>LeoTrack · Presenze & Turni</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f4f6f9;--card:#fff;--line:#e2e8f0;--tx:#0f172a;--mu:#64748b;
  --ac:#1e3a5f;--ac2:#2563eb;--side:#0f172a;--side-tx:#cbd5e1;
  --ok:#15803d;--ok-bg:#dcfce7;
  --wa:#b45309;--wa-bg:#fef3c7;
  --er:#be123c;--er-bg:#ffe4e6
}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);background:var(--bg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:13px 18px;position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--line)}
.brand-wrap{display:flex;align-items:baseline;gap:8px}
.logo{font-weight:800;font-size:18px;letter-spacing:-.02em;color:var(--ac)}
.by{font-size:11px;font-weight:600;color:var(--mu)}
#who{color:var(--mu);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger{display:none;width:auto;padding:8px 11px;background:#f1f5f9;color:var(--tx);border:1px solid var(--line);border-radius:10px;font-size:16px;line-height:1}
main{max-width:1180px;margin:0 auto;padding:18px}

/* Layout Admin con menu laterale */
.adm-shell{display:grid;grid-template-columns:236px minmax(0,1fr);gap:18px;align-items:start}
.sidebar{position:sticky;top:68px;background:var(--side);color:var(--side-tx);border-radius:16px;padding:14px 10px;border:1px solid #1e293b}
.side-sec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#64748b;padding:8px 10px 4px}
.nav-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:10px 12px;margin-bottom:4px;border-radius:10px;background:transparent;color:var(--side-tx);font-weight:600;font-size:14px}
.nav-btn:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-btn.on{background:var(--ac);color:#fff;font-weight:700}
.nav-sep{height:1px;background:rgba(255,255,255,.08);margin:8px 8px}
.side-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:25}

@media (max-width:820px){
  .burger{display:inline-flex;align-items:center;justify-content:center}
  .adm-shell{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:250px;max-width:82vw;z-index:30;border-radius:0;transform:translateX(-100%);transition:transform .2s ease;overflow-y:auto}
  .sidebar.open{transform:translateX(0)}
  .side-backdrop.open{display:block}
}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.card-ok{border-left:4px solid var(--ok)}
.card-wa{border-left:4px solid var(--wa)}
.card-er{border-left:4px solid var(--er)}
.card-ac{border-left:4px solid var(--ac2)}
h2{margin:0 0 12px;font-size:17px}
input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;color:var(--tx);font:inherit;margin:4px 0 10px}
input:focus,select:focus{outline:0;border-color:var(--ac2);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 15px;background:var(--ac);color:#fff;cursor:pointer;width:100%}
button:hover{filter:brightness(1.06)}
button.s{background:#f1f5f9;color:#1e293b;border:1px solid var(--line)}
button.ok{background:var(--ok);color:#fff}
button.wa{background:var(--wa);color:#fff}
button.er{background:var(--er);color:#fff}
button.sm{padding:6px 10px;font-size:13px;width:auto}
button:disabled{opacity:.38;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}.row>*{flex:1;min-width:130px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mu);font-weight:700;font-size:12px;text-transform:uppercase;background:#f8fafc}
.wrap{overflow-x:auto}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;display:inline-block}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-wa{background:var(--wa-bg);color:var(--wa)}.p-no{background:#f1f5f9;color:#475569}.p-er{background:var(--er-bg);color:var(--er)}
.big{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;margin:14px 0 4px;color:var(--ac)}
.mu{color:var(--mu);font-size:13px}.ev{cursor:pointer;display:inline-block;margin:0 8px 4px 0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;display:none;z-index:50;max-width:92%;text-align:center}
#toast.e{background:var(--er)}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-top:4px solid var(--ac);border-radius:14px;width:92%;max-width:420px}
dialog::backdrop{background:rgba(15,23,42,.48)}
#ov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
#ov .b{background:var(--card);border:2px solid var(--ok);border-radius:18px;padding:28px;text-align:center;max-width:340px;width:100%}
</style></head>
<body>
<header>
  <div class="brand-wrap">
    <button id="burger" class="burger" style="display:none" onclick="toggleSide()" aria-label="Menu">☰</button>
    <div class="logo">LeoTrack</div>
    <span class="by">by Leandro</span>
  </div>
  <div id="who"></div>
</header>
<div id="sideBackdrop" class="side-backdrop" onclick="closeSide()"></div>
<main id="app"></main><div id="toast"></div><dialog id="dlg"></dialog><div id="ov" onclick="this.style.display='none'"></div>
<script>
const SB=supabase.createClient('https://mhnrsznxrohpgjelunjj.supabase.co','sb_publishable_n9iHkNj__gNVlihuhlMETw_O7_UxMab');
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T={ENTRATA:'🟢 Entrata',INIZIO_PAUSA:'🟡 Uscita pausa',FINE_PAUSA:'🟢 Rientro pausa',USCITA:'🔴 Uscita'};
const COL={ENTRATA:'ok',FINE_PAUSA:'ok',INIZIO_PAUSA:'wa',USCITA:'er'};
const NEXT={'':['ENTRATA'],USCITA:['ENTRATA'],ENTRATA:['INIZIO_PAUSA','USCITA'],FINE_PAUSA:['INIZIO_PAUSA','USCITA'],INIZIO_PAUSA:['FINE_PAUSA']};
const hm=d=>new Date(d).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
const dt=d=>new Date(d).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const gg=g=>new Date(g+'T12:00').toLocaleDateString('it-IT',{weekday:'short',day:'2-digit',month:'2-digit'});const formatD=d=>d.split('-').reverse().join('/');
const dkey=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let tok=localStorage.getItem('lt_tok'),scan=null,tm=null,ad='',tab='oggi',day=dkey(new Date()),mon=dkey(new Date()).slice(0,7),OPS=[],ROWS=[],CFG=null,EV=[],LAST=null,shown='',lastAl=0,AC=null,nIds='',PEND=null;
function toast(m,e){const t=$('#toast');t.textContent=m;t.className=e?'e':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',4500)}
async function rpc(fn,a){const{data,error}=await SB.rpc(fn,a);if(error){toast(error.message,1);throw error}return data}
function wav(f){const r=22050,d=[],L=r*.16;for(const q of f){for(let i=0;i<L;i++)d.push(Math.sin(2*Math.PI*q*i/r)*Math.min(1,i/200,(L-i)/400)*26000);for(let i=0;i<r*.1;i++)d.push(0)}
  const b=new DataView(new ArrayBuffer(44+d.length*2)),w=(o,t)=>[...t].forEach((c,i)=>b.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF');b.setUint32(4,36+d.length*2,true);w(8,'WAVEfmt ');b.setUint32(16,16,true);b.setUint16(20,1,true);b.setUint16(22,1,true);b.setUint32(24,r,true);b.setUint32(28,r*2,true);b.setUint16(32,2,true);b.setUint16(34,16,true);w(36,'data');b.setUint32(40,d.length*2,true);d.forEach((v,i)=>b.setInt16(44+i*2,v,true));
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
let SND=null;
function snd(){if(!SND){SND={2:new Audio(wav([1046,1318])),3:new Audio(wav([1046,1318,1046]))};Object.values(SND).forEach(a=>a.preload='auto')}return SND}
function tone(n){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();for(let i=0;i<n;i++){const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*.28;o.frequency.value=i%2?1318:1046;g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.2)}}catch(e){}}
function unlockAudio(){try{navigator.audioSession&&(navigator.audioSession.type='playback')}catch(e){}
  try{Object.values(snd()).forEach(a=>{a.muted=true;a.play().then(()=>{a.pause();a.currentTime=0;a.muted=false}).catch(()=>{a.muted=false})})}catch(e){}
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}
['click','touchend'].forEach(ev=>document.addEventListener(ev,unlockAudio,{once:true,passive:true}));
function beep(n=1){if(!n)return unlockAudio();const a=snd()[n>=3?3:2];a.muted=false;a.currentTime=0;a.play().catch(()=>tone(n))}
async function leggiNotifiche(){const st=await rpc('lt_leggi',{p_tok:tok});opView(st)}
setInterval(async()=>{if(!tok||scan||document.hidden)return;try{const{data,error}=await SB.rpc('lt_stato',{p_tok:tok});if(error||!data)return;const ids=(data.notifiche||[]).map(n=>n.id).join();if(ids!==nIds){if(ids){beep(2);navigator.vibrate?.(150)}opView(data)}}catch(e){}},30000);
function alertMsg(st){const td=st.storico.filter(x=>dkey(x.orario)===dkey(new Date())).reverse(),l=td[td.length-1];if(!l)return'';const n=new Date(),m=n.getHours()*60+n.getMinutes();
  if((l.tipo==='ENTRATA'||l.tipo==='FINE_PAUSA')&&!td.some(x=>x.tipo==='INIZIO_PAUSA')&&m>=810)return'Sono passate le 13:30: ricordati di timbrare l\'uscita pausa.';
  if(l.tipo==='INIZIO_PAUSA'&&(n-new Date(l.orario))/6e4>=60)return'La pausa è terminata (60 minuti): non dimenticare di timbrare il rientro pausa!';return''}
setInterval(()=>{if(!tok||!LAST||scan)return;const m=alertMsg(LAST);if(m&&Date.now()-lastAl>18e4){lastAl=Date.now();beep(3);navigator.vibrate?.([200,100,200])}if(m!==shown)opView(LAST)},20000);
function stopScan(){if(scan){scan.stop().catch(()=>{});scan=null}}
function setBurger(show){const b=$('#burger');if(b)b.style.display=show?'':'none'}
function toggleSide(){const s=$('#sidebar'),k=$('#sideBackdrop');if(s)s.classList.toggle('open');if(k)k.classList.toggle('open')}
function closeSide(){const s=$('#sidebar'),k=$('#sideBackdrop');if(s)s.classList.remove('open');if(k)k.classList.remove('open')}

/* ---------- OPERATORE ---------- */
async function opView(st){
  setBurger(false);closeSide();$('#who').textContent='';
  if(!tok){app.innerHTML=`<div class="card card-ac" style="max-width:380px;margin:30px auto"><h2>🔐 Accesso operatore</h2>
    <label class="mu">Codice operatore</label><input id="c" autocapitalize="characters" autocomplete="username">
    <label class="mu">PIN</label><input id="p" type="password" inputmode="numeric" autocomplete="current-password">
    <button onclick="opLogin()">Accedi</button></div>`;return}
  try{st=st||await rpc('lt_stato',{p_tok:tok})}catch(e){if(/Sessione/.test(e.message)){tok=null;localStorage.removeItem('lt_tok');opView()}return}
  LAST=st;const al=alertMsg(st);shown=al;nIds=(st.notifiche||[]).map(n=>n.id).join();const ult=st.storico[0]?st.storico[0].tipo:'';
  const [lab,pc]=ult==='ENTRATA'||ult==='FINE_PAUSA'?['🟢 In servizio','p-ok']:ult==='INIZIO_PAUSA'?['🟡 In pausa','p-wa']:['⚪ Fuori servizio','p-no'];
  $('#who').textContent='👤 '+st.nome;
  app.innerHTML=`<div style="max-width:560px;margin:0 auto">${al?`<div class="card card-er"><b style="color:var(--er)">⏰ ${esc(al)}</b></div>`:''}${(st.notifiche||[]).length?`<div class="card card-ac"><b style="color:var(--ac2)">🔔 Novità</b>${st.notifiche.map(n=>`<div style="margin:8px 0">${esc(n.testo)}<div class="mu">${dt(n.creata)}</div></div>`).join('')}<button class="s sm" onclick="leggiNotifiche()">Ho letto</button></div>`:''}
  <div class="card card-ac"><div class="row" style="align-items:center"><div><div class="mu">Ciao</div><h2 style="margin:0">${esc(st.nome)}</h2></div>
    <div style="text-align:right"><span class="pill ${pc}">${lab}</span></div></div>
    ${Object.keys(T).map(t=>{const on=NEXT[ult].includes(t);return `<div class="row"><button class="${COL[t]}" ${on?'':'disabled'} onclick="qr('${t}')">${T[t]} · QR</button>${st.gps?`<button class="s" ${on?'':'disabled'} onclick="gps('${t}')">📍 GPS</button>`:''}</div>`}).join('')}
    <div id="scanbox" style="display:none"><div id="scanlab" style="font-weight:700;margin-bottom:8px"></div><div id="reader"></div><button class="s" style="margin-top:8px" onclick="stopScan();$('#scanbox').style.display='none'">Annulla</button></div>
    <div class="row" style="margin:6px 0 0"><button class="s sm" onclick="beep(2)">🔊 Prova suono</button><button class="s sm" onclick="opLogout()">🚪 Esci</button></div></div>
  <div class="card"><h2>🕒 Oggi</h2>${(()=>{const o=st.storico.filter(x=>dkey(x.orario)===dkey(new Date())).reverse();return o.length?o.map(x=>`<div class="row" style="margin:0;padding:8px 0;border-bottom:1px solid var(--line)"><b style="color:var(--${COL[x.tipo]})">${T[x.tipo]}</b><b style="text-align:right">${hm(x.orario)}</b></div>`).join(''):'<p class="mu">Nessuna timbratura oggi.</p>'})()}</div>
  <div class="card"><h2>🗓️ I miei turni</h2>${st.turni&&st.turni.length?st.turni.map(x=>`<div class="row" style="margin:0;padding:8px 0;border-bottom:1px solid var(--line)"><b${x.giorno===dkey(new Date())?' style="color:var(--ac2)"':''}>${gg(x.giorno)}</b><span style="text-align:right">${x.riposo?'<span class="pill p-no">Riposo</span>':x.inizio.slice(0,5)+' – '+x.fine.slice(0,5)}</span></div>`).join(''):'<p class="mu">Nessun turno inserito.</p>'}</div>
  <div class="card"><h2>📋 Ultime timbrature</h2>${st.storico.length?st.storico.map(x=>`<div class="row" style="margin:0;padding:8px 0;border-bottom:1px solid var(--line)"><b>${T[x.tipo]}</b><span class="mu" style="text-align:right">${dt(x.orario)} · ${x.metodo}</span></div>`).join(''):'<p class="mu">Nessuna timbratura.</p>'}</div>
  <div class="card"><h2>📝 Richiedi permesso / ferie</h2>
    <select id="lt"><option>Permesso / ROL</option><option>Ferie</option><option>Malattia</option><option>Altro</option></select>
    <label class="mu">Dal (data e ora)</label><input id="ld" type="datetime-local"><label class="mu">Al (data e ora)</label><input id="la" type="datetime-local"><input id="ln" placeholder="Note (facoltative)">
    <button class="s" onclick="permesso()">Invia richiesta</button>
    ${st.permessi.map(p=>`<div class="row mu" style="margin:8px 0 0"><span>${esc(p.tipologia)} · ${dt(p.dal)} → ${dt(p.al)}</span><span style="text-align:right">${p.stato}</span></div>`).join('')}</div></div>`}
async function opLogin(){beep(0);const r=await rpc('lt_login',{p_codice:$('#c').value,p_pin:$('#p').value});if(r.errore)return toast(r.errore,1);tok=r.token;localStorage.setItem('lt_tok',tok);opView()}
function opLogout(){tok=null;localStorage.removeItem('lt_tok');opView()}
async function timbra(t,m,lat,lng,q){const st=await rpc('lt_timbra',{p_tok:tok,p_tipo:t,p_metodo:m,p_lat:lat,p_lng:lng,p_qr:q});navigator.vibrate?.(150);opView(st);conferma(t,st.nome)}
function conferma(t,nome){beep(2);const c='var(--'+COL[t]+')',o=$('#ov');
  o.innerHTML=`<div class="b" style="border-color:${c}"><div style="font-size:48px;color:${c}">✓</div><h2 style="margin:6px 0">${T[t].toUpperCase()} REGISTRATA</h2><div class="mu">${esc(nome)}</div><div class="big" style="color:${c}">${hm(new Date())}</div><button style="margin-top:8px">OK</button></div>`;
  o.style.display='flex';clearTimeout(conferma.t);conferma.t=setTimeout(()=>o.style.display='none',6000)}
function qr(t){beep(0);$('#scanbox').style.display='block';$('#scanlab').textContent='Stai timbrando: '+T[t];scan=new Html5Qrcode('reader');let busy=0;
  scan.start({facingMode:'environment'},{fps:10,qrbox:220},async txt=>{if(busy)return;busy=1;stopScan();$('#scanbox').style.display='none';try{await timbra(t,'QR',null,null,txt)}catch(e){}},()=>{}).catch(()=>toast('Fotocamera non disponibile: controlla i permessi',1))}
function gps(t){beep(0);if(!navigator.geolocation)return toast('GPS non supportato',1);toast('Rilevo la posizione per: '+T[t]+'…');
  navigator.geolocation.getCurrentPosition(async p=>{try{await timbra(t,'GPS',p.coords.latitude,p.coords.longitude,null)}catch(e){}},()=>toast('Posizione non disponibile: abilita il GPS',1),{enableHighAccuracy:true,timeout:12000,maximumAge:0})}
async function permesso(){if(!$('#ld').value||!$('#la').value)return toast('Inserisci le date',1);
  const st=await rpc('lt_permesso',{p_tok:tok,p_tip:$('#lt').value,p_dal:new Date($('#ld').value).toISOString(),p_al:new Date($('#la').value).toISOString(),p_note:$('#ln').value});toast('Richiesta inviata');opView(st)}

/* ---------- KIOSK ---------- */
async function kioskView(){
  setBurger(false);closeSide();
  const{data}=await SB.auth.getSession();if(!data.session)return admLoginCard();
  app.innerHTML=`<div class="card card-ac" style="max-width:420px;margin:20px auto;text-align:center"><h2>📷 Scansiona per timbrare</h2>

/* ---------- ADMIN ---------- */
function admLoginCard(){setBurger(false);closeSide();app.innerHTML=`<div class="card card-ac" style="max-width:380px;margin:30px auto"><h2>🔐 Accesso amministratore</h2>
  <input id="ae" type="email" placeholder="Email" autocomplete="username"><input id="ap" type="password" placeholder="Password" autocomplete="current-password">

  ad=data.session.user.email;$('#who').textContent='🛡️ '+ad;setBurger(true);

  CFG=c;
  app.innerHTML=`<div class="adm-shell">
    <aside id="sidebar" class="sidebar">
      <div class="side-sec">Gestione</div>
      <div id="tabs"></div>
      <div class="side-sec">Strumenti</div>
      <div id="tools"></div>
    </aside>
    <div style="min-width:0">

    </div>

  const ck='style="width:auto;margin:0 5px 0 0"',lb='class="mu" style="flex:0 0 auto;min-width:0"';
  return `<div class="card card-ac"><h2>🗓️ Inserimento rapido dei turni</h2>
   <div class="row"><div><label class="mu">Da (lunedì)</label><input id="ti" type="date" value="${wk}"></div><div><label class="mu">Per quante settimane</label><select id="tw"><option value="1">1</option><option value="4" selected>4</option><option value="8">8</option><option value="12">12</option></select></div></div>
   <div class="row"><div><label class="mu">Inizio</label><input id="ts" type="time" value="08:00"></div><div><label class="mu">Fine</label><input id="te" type="time" value="16:00"></div></div>
   <div class="row" style="gap:8px">${GS.map((g,i)=>`<label ${lb}><input type="checkbox" class="tg" value="${i}" ${i<5?'checked':''} ${ck}>${g}</label>`).join('')}</div>
   <label class="mu" style="display:block"><input type="checkbox" id="tr" checked ${ck}>Segna «Riposo» negli altri giorni</label>
   <label class="mu" style="display:block;margin:8px 0"><input type="checkbox" checked onchange="document.querySelectorAll('.to').forEach(c=>c.checked=this.checked)" ${ck}><b>Tutti gli operatori</b></label>
   <div class="row" style="gap:6px 14px">${OPS.map(p=>`<label ${lb}><input type="checkbox" class="to" value="${p.id}" checked ${ck}>${esc(p.nome)}</label>`).join('')}</div>
   <button class="ok" onclick="applicaTurni()">✓ Applica i turni</button></div>
  <div class="card"><div class="row" style="align-items:center;flex-wrap:nowrap"><button class="s sm" onclick="wk=addD(wk,-7);go('turni')">◀</button><b style="text-align:center">Settimana dal ${formatD(wk)}</b><button class="s sm" onclick="wk=addD(wk,7);go('turni')">▶</button></div>
   <p class="mu">Tocca una casella per cambiare il turno di quel giorno.</p>
   <div class="wrap"><table><tr><th>Operatore${days.map((d,i)=>`<th>${GS[i]} ${d.slice(8)}`).join('')}</tr>${OPS.map(p=>`<tr><td><b>${esc(p.nome)}</b>${days.map(d=>{const x=TU.find(y=>y.operatore_id===p.id&&y.giorno===d);return `<td onclick="editTurno('${p.id}','${d}')" style="cursor:pointer;white-space:nowrap">${x?(x.riposo?'<span class="pill p-no">😴 Riposo</span>':x.inizio.slice(0,5)+'–'+x.fine.slice(0,5)):'<span class="mu">➕</span>'}`}).join('')}`).join('')}</table></div></div>`}
async function applicaTurni(){const ops=[...document.querySelectorAll('.to:checked')].map(c=>c.value),gd=[...document.querySelectorAll('.tg:checked')].map(c=>+c.value),w=+$('#tw').value,st=lun($('#ti').value),ini=$('#ts').value,fin=$('#te').value,rip=$('#tr').checked;
  if(!ops.length)return toast('Seleziona almeno un operatore',1);if(!gd.length&&!rip)return toast('Seleziona almeno un giorno',1);
  const rows=[];for(const op of ops)for(let i=0;i<w*7;i++){const g=addD(st,i);if(gd.includes(i%7))rows.push({operatore_id:op,giorno:g,inizio:ini,fine:fin,riposo:false});else if(rip)rows.push({operatore_id:op,giorno:g,inizio:null,fine:null,riposo:true})}
  if(!confirm('Applicare '+rows.length+' turni per '+w+' settimane dal '+formatD(st)+'? Quelli già presenti verranno sostituiti.'))return;
  for(let i=0;i<rows.length;i+=500){const{error}=await SB.from('lt_turni').upsert(rows.slice(i,i+500),{onConflict:'operatore_id,giorno'});if(error)return toast(error.message,1)}
  wk=st;toast('Turni inseriti');go('turni')}
function editTurno(op,g){const x=TU.find(y=>y.operatore_id===op&&y.giorno===g),p=OPS.find(o=>o.id===op);
  $('#dlg').innerHTML=`<h2>🗓️ Turno del ${formatD(g)}</h2><div class="mu">${esc(p?p.nome:'')}</div><div class="row"><input id="xs" type="time" value="${x&&x.inizio?x.inizio.slice(0,5):'08:00'}"><input id="xe" type="time" value="${x&&x.fine?x.fine.slice(0,5):'16:00'}"></div>
  <div class="row"><button class="s" onclick="saveTurno('${op}','${g}',1)">😴 Riposo</button><button class="ok" onclick="saveTurno('${op}','${g}',0)">💾 Salva turno</button></div>
  <div class="row"><button class="er" onclick="delTurno('${op}','${g}')">🗑️ Elimina</button><button class="s" onclick="$('#dlg').close()">Chiudi</button></div>`;$('#dlg').showModal()}
async function saveTurno(op,g,r){const{error}=await SB.from('lt_turni').upsert({operatore_id:op,giorno:g,inizio:r?null:$('#xs').value,fine:r?null:$('#xe').value,riposo:!!r},{onConflict:'operatore_id,giorno'});if(error)return toast(error.message,1);$('#dlg').close();go('turni')}
async function delTurno(op,g){const{error}=await SB.from('lt_turni').delete().eq('operatore_id',op).eq('giorno',g);if(error)return toast(error.message,1);$('#dlg').close();go('turni')}

/* ---------- ROUTER: / = operatore, #admin = admin, #kiosk = terminale QR ---------- */
function route(){clearInterval(tm);stopScan();const h=location.hash.slice(1);h==='admin'?adminView():h==='kiosk'?kioskView():opView()}
addEventListener('hashchange',route);route();
</script></body></html>
