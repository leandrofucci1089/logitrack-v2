<style>

*{box-sizing:border-box}
body{margin:0;color:var(--tx);background:var(--bg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:13px 18px;position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#262b33;color:#f8fafc;border-bottom:1px solid #475569;box-shadow:0 2px 10px rgba(0,0,0,.22)}

.by{font-size:11px;font-weight:600;color:#94a3b8}

.burger{display:none;width:auto;padding:8px 11px;background:#3b4048;color:#fff;border:1px solid #64748b;border-radius:10px;font-size:16px;line-height:1}
main{max-width:1180px;margin:0 auto;padding:18px}

/* Layout Admin con menu laterale */
.adm-shell{display:grid;grid-template-columns:236px minmax(0,1fr);gap:18px;align-items:start}
.sidebar{position:sticky;top:68px;background:var(--side);color:var(--side-tx);border-radius:16px;padding:14px 10px;border:1px solid #475569;box-shadow:0 6px 20px rgba(0,0,0,.22)}
.side-sec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;padding:8px 10px 4px}
.nav-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:10px 12px;margin-bottom:4px;border-radius:10px;background:transparent;color:var(--side-tx);font-weight:600;font-size:14px}
.nav-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-btn.on{background:var(--ac2);color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(37,99,235,.4)}
.nav-sep{height:1px;background:rgba(255,255,255,.12);margin:8px 8px}
.side-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:25}

@media (max-width:820px){
  .burger{display:inline-flex;align-items:center;justify-content:center}
  .adm-shell{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:250px;max-width:82vw;z-index:30;border-radius:0;transform:translateX(-100%);transition:transform .2s ease;overflow-y:auto}
  .sidebar.open{transform:translateX(0)}
  .side-backdrop.open{display:block}
}

.card{background:var(--card);border:1px solid #94a3b8;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.card-ok{border-left:5px solid var(--ok)}
.card-wa{border-left:5px solid var(--wa)}
.card-er{border-left:5px solid var(--er)}
.card-ac{border-left:5px solid var(--ac2)}
.stat-box{cursor:pointer;transition:transform .12s ease,box-shadow .12s ease;background:#ffffff}
.stat-box:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(0,0,0,.14)}
.stat-box.active{outline:3px solid var(--ac2);background:#eff6ff}
h2{margin:0 0 12px;font-size:17px;color:#0f172a}
input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #94a3b8;background:#fff;color:var(--tx);font:inherit;margin:4px 0 10px}
input:focus,select:focus{outline:0;border-color:var(--ac2);box-shadow:0 0 0 3px rgba(37,99,235,.2)}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 15px;background:var(--ac);color:#fff;cursor:pointer;width:100%;transition:transform .08s ease,filter .12s ease}
button:hover:not(:disabled){filter:brightness(1.08)}
button:active:not(:disabled){transform:scale(.99)}
button.s{background:#e2e8f0;color:#0f172a;border:1px solid #94a3b8}
button.ok{background:var(--ok);color:#fff}
button.wa{background:var(--wa);color:#fff}
button.er{background:var(--er);color:#fff}
button.sm{padding:6px 10px;font-size:13px;width:auto}
button:disabled{opacity:.32;cursor:not-allowed;filter:grayscale(.6);box-shadow:none!important}

/* Tasti timbratura operatore sempre molto evidenti */
.timbra-btn{padding:15px 16px;font-size:16px;letter-spacing:.01em;text-shadow:0 1px 2px rgba(0,0,0,.28)}
.timbra-btn:not(:disabled){box-shadow:0 4px 12px rgba(0,0,0,.24);border:2px solid rgba(255,255,255,.35)}
.timbra-gps:not(:disabled){background:#1e293b;color:#ffffff;border:2px solid #475569;box-shadow:0 4px 12px rgba(0,0,0,.22)}

.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}.row>*{flex:1;min-width:130px}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border-radius:10px;overflow:hidden}
th,td{padding:10px 8px;border-bottom:1px solid #cbd5e1;text-align:left;vertical-align:top}
th{color:#334155;font-weight:700;font-size:12px;text-transform:uppercase;background:#e2e8f0}
.wrap{overflow-x:auto}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;display:inline-block}
.p-ok{background:var(--ok-bg);color:#14532d;border:1px solid #86efac}.p-wa{background:var(--wa-bg);color:#78350f;border:1px solid #fcd34d}.p-no{background:#e2e8f0;color:#334155}.p-er{background:var(--er-bg);color:#7f1d1d;border:1px solid #fca5a5}.p-ac{background:#dbeafe;color:#1e3a8a}
.big{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;margin:14px 0 4px;color:var(--ac)}
.mu{color:var(--mu);font-size:13px}.ev{cursor:pointer;display:inline-block;margin:0 8px 4px 0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;display:none;z-index:50;max-width:92%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#toast.e{background:var(--er)}
dialog{background:var(--card);color:var(--tx);border:1px solid #64748b;border-top:4px solid var(--ac);border-radius:14px;width:92%;max-width:420px;box-shadow:0 16px 40px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(15,23,42,.65)}
#ov{position:fixed;inset:0;background:rgba(15,23,42,.65);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
#ov .b{background:var(--card);border:3px solid var(--ok);border-radius:18px;padding:28px;text-align:center;max-width:340px;width:100%;box-shadow:0 16px 40px rgba(0,0,0,.4)}
</style></head>

async function fetchAll(q){let r=[],i=0;for(;;){const{data}=await q().range(i,i+999);r=r.concat(data||[]);if(!data||data.length<1000)return r;i+=1000}}

function parseTurnoDate(dayStr, timeStr, refDate){
  const [hh,mm]=timeStr.slice(0,5).split(':').map(Number);
  const d=new Date(dayStr+'T00:00:00');
  d.setHours(hh,mm,0,0);
  if(refDate && (d - refDate) < -6*36e5) d.setDate(d.getDate()+1);
  return d;
}

/* Calcolo Pasqua (algoritmo gregoriano) + festività nazionali italiane */
function getEasterMD(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
        f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
        i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
        mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return new Date(y,mo-1,da);
}
function isFestaIT(y,mo,d){
  const mmdd=String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  if(['01-01','01-06','04-25','05-01','06-02','08-15','11-01','12-08','12-25','12-26'].includes(mmdd))return true;
  const pasquetta=getEasterMD(y);
  pasquetta.setDate(pasquetta.getDate()+1);
  return pasquetta.getMonth()+1===mo && pasquetta.getDate()===d;
}
const gmAuto=m=>{
  const[y,mo]=m.split('-').map(Number),n=new Date(y,mo,0).getDate();
  let c=0;
  for(let d=1;d<=n;d++){
    const w=new Date(y,mo-1,d).getDay();
    if(w>0 && w<6 && !isFestaIT(y,mo,d)) c++;
  }
  return c;
};

function calc(ev, turniOp){
  const tMap={};
  (turniOp||[]).forEach(t=>{tMap[t.giorno]=t});
  const dayEvs={};
  for(const e of ev){
    const k=dkey(e.orario);
    if(!dayEvs[k])dayEvs[k]=[];
    dayEvs[k].push(e);
  }
  let o=0,s=0;
  const det=Object.keys(dayEvs).sort().map(k=>{
    const list=dayEvs[k];
    const tn=tMap[k];
    const dtObj=new Date(k+'T12:00');
    const w=dtObj.getDay();
    const we=w===0||w===6||isFestaIT(dtObj.getFullYear(),dtObj.getMonth()+1,dtObj.getDate());
    const causali=[];
    let en=null,ip=null,fp=null,us=null,pz=false;
    for(const e of list){
      const t=new Date(e.orario);
      if(e.tipo==='ENTRATA'&&!en)en=t;
      if(e.tipo==='INIZIO_PAUSA'){pz=true;if(!ip)ip=t}
      if(e.tipo==='FINE_PAUSA'){pz=true;fp=t}
      if(e.tipo==='USCITA')us=t;
    }

    let effIn=en, effOut=us;
    const TOL_MS=15*60000;
    let turnoLabel='–';
    if(tn){
      if(tn.riposo){
        turnoLabel='Riposo';
        causali.push('Lavoro in giorno di riposo');
      }else if(tn.inizio && tn.fine){
        turnoLabel=tn.inizio.slice(0,5)+'–'+tn.fine.slice(0,5);
        const schedIn=parseTurnoDate(k,tn.inizio);
        const schedOut=parseTurnoDate(k,tn.fine,schedIn);
        if(en && Math.abs(en - schedIn) <= TOL_MS){
          effIn=schedIn;
          if(en.getTime()!==schedIn.getTime()) causali.push(`Ingresso in tolleranza (${hm(en)}→${tn.inizio.slice(0,5)})`);
        }else if(en && en < schedIn){
          causali.push(`Anticipo ingresso (${hm(en)})`);
        }else if(en && en > schedIn){
          causali.push(`Ritardo ingresso (${hm(en)})`);
        }
        if(us && Math.abs(us - schedOut) <= TOL_MS){
          effOut=schedOut;
          if(us.getTime()!==schedOut.getTime()) causali.push(`Uscita in tolleranza (${hm(us)}→${tn.fine.slice(0,5)})`);
        }else if(us && us > schedOut){
          causali.push(`Prolungamento uscita (${hm(us)})`);
        }
      }
    }else{
      causali.push('Nessun turno assegnato');
    }

    let rawHours=0, st=null, firstUsed=false;
    const lastExitIdx=list.map(x=>x.tipo).lastIndexOf('USCITA');
    list.forEach((e,idx)=>{
      let t=new Date(e.orario);
      if(e.tipo==='ENTRATA' && !firstUsed && effIn){t=effIn;firstUsed=true}
      if(e.tipo==='USCITA' && idx===lastExitIdx && effOut){t=effOut}
      if(e.tipo==='ENTRATA'||e.tipo==='FINE_PAUSA'){
        st=t;
      }else if(st){
        const diff=(t-st)/36e5;
        if(diff>0 && diff<20) rawHours+=diff;
        st=null;
      }
    });

    let d=0;
    if(!pz && rawHours>10){
      rawHours-=1;
      d=1;
      causali.push('Pausa -1h automatica (>10h)');
    }

    let ord=0, rawStrMin=0;
    if(tn && !tn.riposo && tn.inizio && tn.fine){
      const schedIn=parseTurnoDate(k,tn.inizio);
      const schedOut=parseTurnoDate(k,tn.fine,schedIn);
      let pauseH=0;
      if(ip && fp && fp>ip) pauseH=(fp-ip)/36e5;
      else if(d) pauseH=1;
      const schedNetH=Math.max(0,((schedOut-schedIn)/36e5)-pauseH);
      ord=Math.min(schedNetH, rawHours);
      rawStrMin=Math.max(0, Math.round((rawHours - schedNetH)*60));
    }else if((tn && tn.riposo) || we){
      ord=0;
      rawStrMin=Math.max(0, Math.round(rawHours*60));
      if(we && (!tn || !tn.riposo)) causali.push('Straordinario festivo/weekend');
    }else{
      ord=Math.min(8, rawHours);
      rawStrMin=Math.max(0, Math.round((rawHours - 8)*60));
    }

    const strBlocks=Math.floor((rawStrMin + 0.001) / 30);
    const str=strBlocks * 0.5;
    if(rawStrMin>0 && str===0){
      causali.push(`Extra ${rawStrMin}m (<30m, non maturato)`);
    }else if(str>0){
      causali.push(`Straordinario maturato: ${str*60}m`);
    }

    o+=ord;
    s+=str;
    return {k,w,en,ip,fp,us,pz,d,h:rawHours,ord,str,turnoLabel,causali:causali.join(' · ')};
  });
  return {g:det.length,o,s,det};
}

let RC={m:null,ops:[],ev:[],tu:[]},RFILT='ALL',GM=null,RROWS=[];
const r2=n=>Math.round(n*100)/100,eur=n=>n==null?'–':'€ '+n.toFixed(2).replace('.',','),fh=n=>n.toFixed(2).replace('.',',');

async function tRep(){
  if(RC.m!==mon){
    const a=new Date(mon+'-01T00:00'),b=new Date(a.getFullYear(),a.getMonth()+1,1);
    const dStart=mon+'-01';
    const dEnd=dkey(new Date(a.getFullYear(),a.getMonth()+1,0));
    const[o,ev,tu]=await Promise.all([
      SB.from('lt_operatori').select('id,codice,nome,sede,netto').order('nome'),
      fetchAll(()=>SB.from('lt_timbrature').select('operatore_id,tipo,orario').gte('orario',a.toISOString()).lt('orario',b.toISOString()).order('orario')),
      fetchAll(()=>SB.from('lt_turni').select('operatore_id,giorno,inizio,fine,riposo').gte('giorno',dStart).lte('giorno',dEnd))
    ]);
    RC={m:mon,ops:o.data||[],ev,tu};
  }
  const sedi=[...new Set(RC.ops.map(p=>(p.sede||'').trim()).filter(Boolean))].sort();
  if(RFILT!=='ALL' && !RFILT.startsWith('SEDE:') && !RFILT.startsWith('OP:')) RFILT='ALL';

  const filteredOps=RC.ops.filter(p=>{
    if(RFILT==='ALL')return true;
    if(RFILT.startsWith('SEDE:'))return (p.sede||'').trim()===RFILT.slice(5);
    if(RFILT.startsWith('OP:'))return p.id===RFILT.slice(3);
    return true;
  });

  const gm=GM||gmAuto(mon);
  RROWS=filteredOps.map(p=>{
    const c=calc(RC.ev.filter(x=>x.operatore_id===p.id), RC.tu.filter(x=>x.operatore_id===p.id));
    const tar=p.netto!=null?(p.netto/gm)/8:null;
    return {p,...c,tar,imp:tar!=null?r2(tar*c.s):null};
  });
  const tot=RROWS.reduce((a,r)=>a+(r.imp||0),0);

  return `<div class="card card-ac"><h2>📈 Report presenze e straordinari</h2>
  <div class="row">
    <div><label class="mu">Mese</label><input type="month" value="${mon}" onchange="mon=this.value;GM=null;go('rep')"></div>
    <div><label class="mu">Giorni lavorativi (calendario IT)</label><input type="number" min="1" max="31" value="${gm}" onchange="GM=+this.value||null;go('rep')"></div>
    <div><label class="mu">Filtro Operatori / Sede</label>
      <select onchange="RFILT=this.value;go('rep')">
        <option value="ALL" ${RFILT==='ALL'?'selected':''}>👥 Tutti gli operatori (${RC.ops.length})</option>
        ${sedi.length?`<optgroup label="Filtra per Sede">${sedi.map(s=>`<option value="SEDE:${esc(s)}" ${RFILT==='SEDE:'+s?'selected':''}>📍 Sede: ${esc(s)}</option>`).join('')}</optgroup>`:''}
        <optgroup label="Singolo Operatore">${RC.ops.map(p=>`<option value="OP:${p.id}" ${RFILT==='OP:'+p.id?'selected':''}>👤 ${esc(p.nome)} (${esc(p.sede||'–')})</option>`).join('')}</optgroup>
      </select>
    </div>
  </div>
  <div class="row"><button class="ok" onclick="csvRiep()">⬇️ Esporta riepilogo</button><button class="s" onclick="csvDett()">⬇️ Esporta dettaglio giornaliero</button></div>
  <p class="mu">Clicca su un operatore per il dettaglio giornaliero e le causali. <b>Calcolo:</b> Netto ÷ ${gm} gg lavorativi (calendario IT) ÷ 8 h × ore straordinario. Tolleranza <b>±15 min</b> sul turno; anticipi/prolungamenti oltre 15 min maturano straordinario a scatti di <b>30 minuti</b>.</p>
  <div class="wrap"><table><tr><th>Operatore<th>Sede<th>Giorni<th>Ordinarie<th>Straord.<th>Netto<th>€/ora<th>Importo straord.</tr>${RROWS.map(r=>`<tr onclick="repDett('${r.p.id}')" style="cursor:pointer" title="Clicca per dettaglio giornaliero e causali"><td><b style="color:var(--ac2)">${esc(r.p.nome)}</b><div class="mu">${esc(r.p.codice)}</div><td>${esc(r.p.sede||'–')}<td>${r.g}<td>${fh(r.o)} h<td><b>${fh(r.s)} h</b><td>${r.p.netto!=null?eur(+r.p.netto):'<span class="pill p-er">manca</span>'}<td>${r.tar!=null?eur(r.tar):'–'}<td><b>${eur(r.imp)}</b>`).join('')}</table></div>
  <p style="text-align:right"><b>Totale straordinari: ${eur(tot)}</b></p></div>`}

function repDett(id){const r=RROWS.find(x=>x.p.id===id);if(!r)return;const N=['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
  const dlg=$('#dlg');dlg.style.maxWidth='840px';
  dlg.innerHTML=`<h2>📋 ${esc(r.p.nome)}</h2><div class="mu" style="margin-bottom:10px">Periodo ${mon} · ${r.g} giorni · Ordinarie ${fh(r.o)} h · Straordinario <b>${fh(r.s)} h</b></div>
  <div class="wrap"><table><tr><th>Giorno<th>Turno<th>Ingresso<th>Pausa<th>Fine pausa<th>Uscita<th>Straord.<th>Causali / Note</tr>
  ${r.det.length?r.det.map(d=>`<tr><td><b>${N[d.w]} ${formatD(d.k).slice(0,5)}</b><td><span class="pill p-no">${esc(d.turnoLabel)}</span><td>${d.en?hm(d.en):'–'}<td>${d.ip?hm(d.ip):(d.d?'<span class="mu">(-1h auto)</span>':'–')}<td>${d.fp?hm(d.fp):'–'}<td>${d.us?hm(d.us):'–'}<td><b>${fh(d.str)} h</b><td class="mu">${esc(d.causali||'–')}</tr>`).join(''):'<tr><td colspan="8" class="mu">Nessuna timbratura nel periodo.</td></tr>'}
  </table></div>
  <button class="s" style="margin-top:12px" onclick="$('#dlg').style.maxWidth='';$('#dlg').close()">Chiudi</button>`;
  dlg.showModal()}

function dl(nome,L){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+L.join('\n')],{type:'text/csv'}));a.download=nome;a.click()}
function csvRiep(){dl('riepilogo_'+mon+'.csv',['Codice;Operatore;Sede;Giorni lavorati;Ore ordinarie;Ore straordinario;Netto;Euro per ora;Importo straordinario'].concat(RROWS.map(r=>[r.p.codice,r.p.nome,r.p.sede||'',r.g,fh(r.o),fh(r.s),r.p.netto!=null?fh(+r.p.netto):'',r.tar!=null?fh(r.tar):'',r.imp!=null?fh(r.imp):''].join(';'))))}
function csvDett(){const N=['Dom','Lun','Mar','Mer','Gio','Ven','Sab'],L=['Data;Giorno;Codice;Operatore;Sede;Turno;Entrata;Uscita;Pausa timbrata;Pausa scalata (h);Ore nette;Ordinarie;Straordinario;Causali'];
  RROWS.forEach(r=>r.det.forEach(d=>L.push([formatD(d.k),N[d.w],r.p.codice,r.p.nome,r.p.sede||'',d.turnoLabel,d.en?hm(d.en):'',d.us?hm(d.us):'',d.pz?'sì':'no',d.d,fh(d.h),fh(d.ord),fh(d.str),d.causali].join(';'))));dl('dettaglio_'+mon+'.csv',L)}

async function tSede(){return `<div class="card card-ac"><h2>📍 Sede per timbratura GPS</h2><p class="mu">Gli operatori con «GPS in sede» timbrano entro 50 o 100 m da questo punto (lo scegli per ogni operatore); «GPS ovunque» non ha limiti. Il controllo è fatto dal server.</p>
  <div class="row"><input id="la1" placeholder="Latitudine" value="${CFG.hq_lat??''}"><input id="lo1" placeholder="Longitudine" value="${CFG.hq_lng??''}"></div>
  <div class="row"><button class="s" onclick="detect()">🎯 Rileva la mia posizione</button><button class="ok" onclick="saveSede()">💾 Salva</button></div></div>`}
function detect(){navigator.geolocation.getCurrentPosition(p=>{$('#la1').value=p.coords.latitude.toFixed(6);$('#lo1').value=p.coords.longitude.toFixed(6)},()=>toast('Posizione non disponibile',1),{enableHighAccuracy:true})}
async function saveSede(){const la=parseFloat($('#la1').value),lo=parseFloat($('#lo1').value),ra=CFG.raggio;if(isNaN(la)||isNaN(lo))return toast('Coordinate non valide',1);
  const{error}=await SB.from('lt_config').update({hq_lat:la,hq_lng:lo,raggio:ra}).eq('id',1);if(error)return toast(error.message,1);CFG={...CFG,hq_lat:la,hq_lng:lo,raggio:ra};toast('Sede salvata')}

/* ---------- AVVISO PERMESSI DA GESTIRE ---------- */
function drawPend(){const c=$('#pc'),b=$('#pb');if(c)c.textContent=PEND?' ('+PEND+')':'';if(b)b.innerHTML=PEND&&tab!=='perm'?`<div class="card card-wa" style="cursor:pointer" onclick="PERM_FILT='In attesa';go('perm')"><b style="color:var(--wa)">🔔 Permessi: ${PEND} da gestire</b></div>`:''}
async function pendRefresh(){if(!ad)return;const{count,error}=await SB.from('lt_permessi').select('id',{count:'exact',head:true}).eq('stato','In attesa');if(error)return;const old=PEND;PEND=count||0;if(old!==null&&PEND>old){beep(2);toast('Nuova richiesta di permesso: '+PEND+' da gestire')}drawPend()}
setInterval(()=>{if(ad&&location.hash==='#admin')pendRefresh()},45000);

/* ---------- TURNI ---------- */
const GS=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
const addD=(d,n)=>{d=new Date(d+'T12:00');d.setDate(d.getDate()+n);return dkey(d)};
const lun=d=>{const x=new Date(d+'T12:00');return addD(d,-((x.getDay()+6)%7))};
let wk=lun(dkey(new Date())),TU=[];
async function tTurni(){
  const[o,t]=await Promise.all([SB.from('lt_operatori').select('id,nome').eq('attivo',true).order('nome'),SB.from('lt_turni').select('*').gte('giorno',wk).lte('giorno',addD(wk,6))]);
  OPS=o.data||[];TU=t.data||[];const days=[0,1,2,3,4,5,6].map(i=>addD(wk,i));
  const ck='style="width:auto;margin:0 5px 0 0"',lb='class="mu" style="flex:0 0 auto;min-width:0"';
  return `<div class="card card-ac"><h2>🗓️ Inserimento rapido dei turni</h2>
   <div class="row"><div><label class="mu">Da (lunedì)</label><input id="ti" type="date" value="${wk}"></div><div><label class="mu">Per quante settimane</label><select id="tw"><option value="1">1</option><option value="4" selected>4</option><option value="8">8</option><option value="12">12</option></select></div></div>
   <div class="row"><div><label class="mu">Inizio</label><input id="ts" type="time" value="08:00"></div><div><label class="mu">Fine</label><input id="te" type="time" value="16:00"></div></div>
   <div class="row" style="gap:8px">${GS.map((g,i)=>`<label ${lb}><input type="checkbox" class="tg" value="${i}" ${i<5?'checked':''} ${ck}>${g}</label>`).join('')}</div>
   <label class="mu" style="display:block"><input type="checkbox" id="tr" checked ${ck}>Segna «Riposo» negli altri giorni</label>
   <label class="mu" style="display:block;margin:8px 0"><input type="checkbox" checked onchange="document.querySelectorAll('.to').forEach(c=>c.checked=this.checked)" ${ck}><b>Tutti gli operatori</b></label>
   <div class="row" style="gap:6px 14px">${OPS.map(p=>`<label ${lb}><input type="checkbox" class="to" value="${p.id}" checked ${ck}>${esc(p.nome)}</label>`).join('')}</div>
   <button class="ok" onclick="applicaTurni()">✓ Applica i turni</button></div>
  <div class="card"><div class="row" style="align-items:center;flex-wrap:nowrap"><button class="s sm" onclick="wk=addD(wk,-7);go('turni')">◀</button><b style="text-align:center">Settimana dal ${formatD(wk)}</b><button class="s sm" onclick="wk=addD(wk,7);go('turni')">▶</button></div>
   <p class="mu">Tocca una casella per cambiare il turno di quel giorno.</p>
   <div class="wrap"><table><tr><th>Operatore${days.map((d,i)=>`<th>${GS[i]} ${d.slice(8)}`).join('')}</tr>${OPS.map(p=>`<tr><td><b>${esc(p.nome)}</b>${days.map(d=>{const x=TU.find(y=>y.operatore_id===p.id&&y.giorno===d);return `<td onclick="editTurno('${p.id}','${d}')" style="cursor:pointer;white-space:nowrap">${x?(x.riposo?'<span class="pill p-no">😴 Riposo</span>':x.inizio.slice(0,5)+'–'+x.fine.slice(0,5)):'<span class="mu">➕</span>'}`}).join('')}`).join('')}</table></div></div>`}
async function applicaTurni(){const ops=[...document.querySelectorAll('.to:checked')].map(c=>c.value),gd=[...document.querySelectorAll('.tg:checked')].map(c=>+c.value),w=+$('#tw').value,st=lun($('#ti').value),ini=$('#ts').value,fin=$('#te').value,rip=$('#tr').checked;
  if(!ops.length)return toast('Seleziona almeno un operatore',1);if(!gd.length&&!rip)return toast('Seleziona almeno un giorno',1);
  const rows=[];for(const op of ops)for(let i=0;i<w*7;i++){const g=addD(st,i);if(gd.includes(i%7))rows.push({operatore_id:op,giorno:g,inizio:ini,fine:fin,riposo:false});else if(rip)rows.push({operatore_id:op,giorno:g,inizio:null,fine:null,riposo:true})}
  if(!confirm('Applicare '+rows.length+' turni per '+w+' settimane dal '+formatD(st)+'? Quelli già presenti verranno sostituiti.'))return;
  for(let i=0;i<rows.length;i+=500){const{error}=await SB.from('lt_turni').upsert(rows.slice(i,i+500),{onConflict:'operatore_id,giorno'});if(error)return toast(error.message,1)}
  wk=st;toast('Turni inseriti');go('turni')}
function editTurno(op,g){const x=TU.find(y=>y.operatore_id===op&&y.giorno===g),p=OPS.find(o=>o.id===op);
  $('#dlg').innerHTML=`<h2>🗓️ Turno del ${formatD(g)}</h2><div class="mu">${esc(p?p.nome:'')}</div><div class="row"><input id="xs" type="time" value="${x&&x.inizio?x.inizio.slice(0,5):'08:00'}"><input id="xe" type="time" value="${x&&x.fine?x.fine.slice(0,5):'16:00'}"></div>
  <div class="row"><button class="s" onclick="saveTurno('${op}','${g}',1)">😴 Riposo</button><button class="ok" onclick="saveTurno('${op}','${g}',0)">💾 Salva turno</button></div>
  <div class="row"><button class="er" onclick="delTurno('${op}','${g}')">🗑️ Elimina</button><button class="s" onclick="$('#dlg').close()">Chiudi</button></div>`;$('#dlg').showModal()}
async function saveTurno(op,g,r){const{error}=await SB.from('lt_turni').upsert({operatore_id:op,giorno:g,inizio:r?null:$('#xs').value,fine:r?null:$('#xe').value,riposo:!!r},{onConflict:'operatore_id,giorno'});if(error)return toast(error.message,1);$('#dlg').close();go('turni')}
async function delTurno(op,g){const{error}=await SB.from('lt_turni').delete().eq('operatore_id',op).eq('giorno',g);if(error)return toast(error.message,1);$('#dlg').close();go('turni')}
